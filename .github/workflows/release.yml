name: Release

# 1. Pushing a tag vX.Y.Z (matching the plugin header Version) creates a DRAFT
#    release with generated notes. CI never builds or signs the plugin zip:
#    the signing key stays offline with the maintainer.
# 2. The maintainer runs `make release` locally and uploads wp-ai-gatekeeper.zip,
#    wp-ai-gatekeeper.zip.sig, and update.json to the draft, then publishes it.
# 3. On publish, CI downloads the assets and verifies the signature against the
#    keys in includes/release-keys.php, so a missing or wrong signature is
#    noticed immediately (installed sites would refuse the update).
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

jobs:
  draft:
    name: Create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' wp-ai-gatekeeper.php)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin header Version ${version}" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --generate-notes

  verify:
    name: Verify published release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --dir assets --pattern 'wp-ai-gatekeeper.zip*' --pattern 'update.json'

      - name: Verify signature and manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          php bin/release-tool.php verify assets/wp-ai-gatekeeper.zip
          actual="v$(php -r 'echo json_decode(file_get_contents("assets/update.json"), true)["version"];')"
          if [ "$TAG" != "$actual" ]; then
            echo "update.json version $actual does not match $TAG" >&2
            exit 1
          fi
