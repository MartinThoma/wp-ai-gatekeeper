name: Release

# Push a tag matching the plugin header version (e.g. v1.0.0) to publish
# wp-ai-gatekeeper.zip as a GitHub release asset. The README's install links
# point at releases/latest/download/wp-ai-gatekeeper.zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(sed -n 's/^ \* Version: *//p' wp-ai-gatekeeper.php)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin header Version ${version}" >&2
            exit 1
          fi

      - name: Build plugin zip
        run: make dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/wp-ai-gatekeeper.zip --title "${GITHUB_REF_NAME}" --generate-notes
