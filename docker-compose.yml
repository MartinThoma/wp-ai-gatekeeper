services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'staging' );
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/wp-ai-gatekeeper

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'staging' );
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/wp-ai-gatekeeper
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for WordPress files to be ready...';
        until [ -f /var/www/html/wp-includes/version.php ]; do sleep 2; done;
        until wp db check --path=/var/www/html >/dev/null 2>&1; do sleep 2; done;
        wp config set WP_ENVIRONMENT_TYPE staging --type=constant --path=/var/www/html || true;
        if ! wp core is-installed --path=/var/www/html; then
          echo 'Installing WordPress and activating WP AI Gatekeeper...';
          wp core install \
            --path=/var/www/html \
            --url=http://localhost:8080 \
            --title='WP AI Gatekeeper Dev' \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email;
        fi;
        wp rewrite structure '/%postname%/' --hard --path=/var/www/html;
        wp plugin activate wp-ai-gatekeeper --path=/var/www/html;
        echo 'WordPress is ready at http://localhost:8080 (login: admin / admin)';
      "

  # --- PHPUnit test stack (only started via `make test`) ---
  testdb:
    image: mariadb:10.11
    profiles: ["test"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WP_VERSION: ${WP_VERSION:-latest}
    image: wp-ai-gatekeeper-tests:php${PHP_VERSION:-8.3}-wp${WP_VERSION:-latest}
    depends_on:
      testdb:
        condition: service_healthy
    volumes:
      - .:/app:ro

volumes:
  db_data:
  wp_data:
