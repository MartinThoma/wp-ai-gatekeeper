# Setup (once per clone):  composer install && pre-commit install
# Run on everything:       pre-commit run --all-files
#
# phpcbf fixes what it can; if it changed files the commit stops so you can
# review and re-stage them. phpcs then blocks on anything left (it also checks
# escaping, nonces, prepared SQL, and PHP 7.4 compatibility). Config: phpcs.xml.dist.
repos:
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf (auto-fix WordPress Coding Standards)
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
      - id: phpcs
        name: phpcs (WordPress Coding Standards)
        entry: vendor/bin/phpcs
        language: system
        types: [php]
